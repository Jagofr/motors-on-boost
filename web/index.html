<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>M.O.B. // Motors on Boost</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS / Apple Specific PWA Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="M.O.B." />

  <!-- iOS Home Screen Icons (iOS ignores manifest icons) -->
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      touch-action: none;
    }

    #webgl {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* iOS & Mobile Landscape Enforcement Overlay */
    #rotate-device-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #08080c;
      color: #fff;
      z-index: 999999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    #rotate-device-overlay .rotate-icon {
      font-size: 54px;
      margin-bottom: 16px;
      animation: rotate-pulse 2s infinite ease-in-out;
    }

    #rotate-device-overlay h2 {
      margin: 0 0 8px 0;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ff0055;
    }

    #rotate-device-overlay p {
      margin: 0;
      font-size: 0.95rem;
      color: #8892b0;
    }

    @keyframes rotate-pulse {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }

    /* Trigger shield when in portrait mode on mobile viewports */
    @media screen and (orientation: portrait) and (max-width: 1024px) {
      #rotate-device-overlay {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <!-- Portrait Lock Fallback Banner -->
  <div id="rotate-device-overlay">
    <div class="rotate-icon">📱 ↷</div>
    <h2>Rotate Device</h2>
    <p>Please turn your iPhone to landscape mode to drive.</p>
  </div>

  <canvas id="webgl"></canvas>
  <script src="game.js"></script>
</body>
</html>
